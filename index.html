<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Hangout</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#07080d;--panel:#0d0f17;--card:#11131d;--border:rgba(255,255,255,.09);--text:#f5f7ff;--muted:#858b9b;--accent:#7c5cff;--danger:#ef4444}
html,body{width:100%;height:100%;font-family:Inter,Arial,sans-serif;background:var(--bg);color:var(--text);overflow:hidden}
button,input{font:inherit}button{cursor:pointer}
#landing{height:100%;display:flex;align-items:center;justify-content:center;padding:20px;background:radial-gradient(circle at 20% 10%,rgba(124,92,255,.16),transparent 32%),radial-gradient(circle at 90% 90%,rgba(80,65,210,.12),transparent 30%),var(--bg)}
.landing-card{width:min(440px,100%);text-align:center;padding:38px 28px;border:1px solid var(--border);background:rgba(17,19,29,.78);border-radius:24px;box-shadow:0 30px 90px rgba(0,0,0,.4)}
.logo{width:58px;height:58px;margin:0 auto 18px;border-radius:17px;display:grid;place-items:center;background:linear-gradient(135deg,#8b6cff,#5c48e8);font-size:27px;box-shadow:0 14px 40px rgba(124,92,255,.28)}
h1{font-size:30px;letter-spacing:-1px;margin-bottom:8px}
.landing-card p{font-size:12px;color:var(--muted);line-height:1.6;margin-bottom:26px}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{height:48px;border-radius:13px;border:1px solid var(--border);color:#fff;background:rgba(255,255,255,.045);font-weight:700}
.btn.primary{border:0;background:linear-gradient(135deg,#8668ff,#6250e8);box-shadow:0 12px 30px rgba(105,80,232,.22)}
.btn:disabled{opacity:.5;cursor:not-allowed}
#room{display:none;width:100%;height:100%}
.room{height:100%;display:flex;flex-direction:column}
.top{height:58px;flex:0 0 58px;border-bottom:1px solid var(--border);background:rgba(10,11,17,.94);display:flex;align-items:center;justify-content:space-between;padding:0 15px}
.brand{display:flex;align-items:center;gap:9px;font-size:13px;font-weight:800}
.brand-mark{width:31px;height:31px;border-radius:9px;display:grid;place-items:center;background:linear-gradient(135deg,#8668ff,#5d4ae9);font-size:15px}
.status{font-size:10px;color:#747b8c}
.status.online{color:#4ade80}
.top-actions{display:flex;gap:7px}
.small-btn{height:34px;padding:0 12px;border:1px solid var(--border);border-radius:9px;background:rgba(255,255,255,.04);color:#ddd;font-size:10px;font-weight:600}
.small-btn.leave{color:#ff9b9b;border-color:rgba(239,68,68,.2);background:rgba(239,68,68,.08)}
.body{flex:1;min-height:0;display:flex}
.media{width:75%;min-width:0;position:relative;background:#05060a;padding:14px}
.media-card{width:100%;height:100%;position:relative;overflow:hidden;border:1px solid var(--border);border-radius:16px;background:#020307;display:flex;align-items:center;justify-content:center}
#screenVideo{width:100%;height:100%;object-fit:contain;background:#020307;display:none}
.media-card.fill-mode #screenVideo{object-fit:cover}
.placeholder{text-align:center;color:#666d7e;padding:20px}
.placeholder .icon{font-size:38px;margin-bottom:12px}
.placeholder h2{font-size:14px;color:#c6c9d2;margin-bottom:6px}
.placeholder p{font-size:10px;line-height:1.5}
.live{position:absolute;left:12px;top:12px;z-index:5;display:none;padding:6px 9px;border-radius:999px;background:rgba(220,38,38,.9);font-size:9px;font-weight:800;letter-spacing:.04em}
.media-card.live-on .live{display:block}
.media-card.live-on #screenVideo{display:block}
.media-card.live-on .placeholder{display:none}
.controls{position:absolute;left:0;right:0;bottom:0;z-index:10;padding:14px;display:flex;align-items:center;gap:7px;background:linear-gradient(transparent,rgba(0,0,0,.86));opacity:0;transform:translateY(7px);pointer-events:none;transition:.18s}
.media-card.controls .controls,.media-card:hover .controls{opacity:1;transform:none;pointer-events:auto}
.ctrl{height:38px;min-width:38px;padding:0 10px;border-radius:10px;border:1px solid rgba(255,255,255,.12);background:rgba(0,0,0,.5);color:#fff;font-size:11px}
.ctrl.active{background:rgba(124,92,255,.25);border-color:rgba(124,92,255,.45)}
.quality{margin-left:auto;height:34px;border:1px solid rgba(255,255,255,.12);background:rgba(0,0,0,.5);color:#fff;border-radius:9px;padding:0 8px;font-size:9px}
.quality option{background:#11131d;color:#fff}
.chat{width:25%;min-width:260px;background:#0c0e15;border-left:1px solid var(--border);display:flex;flex-direction:column}
.chat-head{height:51px;flex:0 0 51px;padding:0 13px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.chat-title{font-size:12px;font-weight:700}.chat-count{font-size:9px;color:#6f7585}
.messages{flex:1;min-height:0;overflow-y:auto;padding:14px 12px}
.msg{display:flex;gap:8px;margin-bottom:14px}
.avatar{width:29px;height:29px;flex:0 0 29px;border-radius:9px;display:grid;place-items:center;background:linear-gradient(135deg,#6e5df5,#9a7dff);font-size:10px;font-weight:800}
.msg-name{font-size:10px;font-weight:700}.msg-time{font-size:8px;color:#5d6371;margin-left:5px}.msg-text{font-size:10px;line-height:1.5;color:#b7bac5;margin-top:3px;word-break:break-word}
.chat-form{padding:9px;border-top:1px solid var(--border)}
.chat-box{display:flex;gap:5px;padding:5px;background:#080910;border:1px solid var(--border);border-radius:11px}
.chat-box input{flex:1;min-width:0;border:0;outline:0;background:transparent;color:#fff;font-size:10px;padding:7px}
.send{width:32px;border:0;border-radius:8px;background:rgba(124,92,255,.18);color:#fff}
.toast{position:fixed;left:50%;bottom:20px;transform:translate(-50%,20px);opacity:0;pointer-events:none;background:#171924;border:1px solid var(--border);color:#fff;border-radius:10px;padding:10px 14px;font-size:10px;z-index:100;transition:.2s}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media(max-width:800px){
  .top{height:45px;flex-basis:45px;padding:0 9px}.brand-mark{width:27px;height:27px;font-size:13px}.brand{font-size:11px}.status{font-size:8px}
  .top-actions{gap:4px}.small-btn{height:29px;padding:0 8px;font-size:8px}
  .body{flex-direction:column}.media{width:100%;height:45%;padding:7px;flex:0 0 45%}.chat{width:100%;height:55%;min-width:0;flex:0 0 55%;border-left:0;border-top:1px solid var(--border)}
  .chat-head{height:34px;flex-basis:34px;padding:0 10px}.messages{padding:7px 9px}.msg{margin-bottom:8px}.avatar{width:24px;height:24px;flex-basis:24px;border-radius:7px;font-size:8px}.msg-name{font-size:9px}.msg-text{font-size:9px}.chat-form{padding:5px}.chat-box input{font-size:9px;padding:5px}
  .controls{padding:8px}.ctrl{height:34px;min-width:34px;padding:0 8px}.quality{height:31px;font-size:8px}
}
@media(max-width:500px) and (orientation:landscape){
  .body{flex-direction:row}.media{width:75%;height:100%;flex:0 0 75%}.chat{width:25%;height:100%;flex:0 0 25%;border-left:1px solid var(--border);border-top:0}.chat-head{height:38px;flex-basis:38px}
}
@media(max-width:500px) and (orientation:portrait){
  .landing-card{padding:30px 20px}.actions{grid-template-columns:1fr}
  .room .top{display:none}.media{height:45%;flex-basis:45%}.chat{height:55%;flex-basis:55%}
}

.debug-panel{position:fixed;left:8px;right:8px;bottom:8px;z-index:9999;display:none;max-height:34vh;overflow:auto;padding:8px 10px;border:1px solid rgba(255,255,255,.2);border-radius:10px;background:rgba(0,0,0,.9);color:#7CFFB2;font:10px/1.45 monospace;white-space:pre-wrap;pointer-events:none}
</style>
</head>
<body>
<section id="landing">
  <div class="landing-card">
    <div class="logo">◉</div>
    <h1>Hangout</h1>
    <p>Private 2-person screen sharing with chat.<br>Just you and one friend.</p>
    <div class="actions">
      <button class="btn primary" id="createBtn">Create</button>
      <button class="btn" id="joinBtn">Join</button>
    </div>
  </div>
</section>

<section id="room">
  <div class="room">
    <header class="top">
      <div>
        <div class="brand"><span class="brand-mark">◉</span> Hangout <span id="roleStatus" class="status">Connecting…</span></div>
      </div>
      <div class="top-actions">
        <button class="small-btn" id="micBtn">🎤 Mic</button><button class="small-btn" id="shareBtn">Share Screen</button>
        <button class="small-btn leave" id="leaveBtn">Leave</button>
      </div>
    </header>
    <main class="body">
      <section class="media">
        <div class="media-card" id="mediaCard">
          <video id="screenVideo" autoplay playsinline></video>
          <audio id="screenAudio" autoplay></audio>
          <div class="live">● LIVE SCREEN</div>
          <div class="placeholder" id="placeholder">
            <div class="icon">▣</div>
            <h2>Screen share</h2>
            <p id="placeholderText">Create the room and share your screen.<br>Your friend will see it here.</p>
          </div>
          <div class="controls" id="controls">
            <button class="ctrl" id="controlShare">▣ Share</button>
            <button class="ctrl" id="fitBtn">Fit</button>
            <select class="quality" id="quality" title="Viewing quality">
              <option value="source">Source</option>
              <option value="480">480p</option>
              <option value="720">720p</option>
              <option value="1080">1080p</option>
            </select>
          </div>
        </div>
      </section>
      <aside class="chat">
        <div class="chat-head"><span class="chat-title">Chat</span><span class="chat-count" id="memberCount">Waiting for friend</span></div>
        <div class="messages" id="messages"></div>
        <form class="chat-form" id="chatForm">
          <div class="chat-box"><input id="chatInput" maxlength="500" autocomplete="off" placeholder="Type a message…"><button class="send" type="submit">➤</button></div>
        </div>
      </aside>
    </main>
  </div>
</section>

<div class="toast" id="toast"></div><div class="debug-panel" id="debugPanel"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL="https://yfqqbdocdbivuieeyldo.supabase.co";
const SUPABASE_KEY="sb_publishable_JBouQaYKn-Fiye1Go6-cJA_rhJVHi4A";
const supabaseClient=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const ROOM_CODE="hangout-duo";
const ICE_CONFIG={iceServers:[
  {urls:"stun:stun.l.google.com:19302"},
  {urls:"stun:stun1.l.google.com:19302"},
  {urls:"turn:openrelay.metered.ca:80",username:"openrelayproject",credential:"openrelayproject"},
  {urls:"turn:openrelay.metered.ca:443",username:"openrelayproject",credential:"openrelayproject"},
  {urls:"turns:openrelay.metered.ca:443?transport=tcp",username:"openrelayproject",credential:"openrelayproject"}
],iceCandidatePoolSize:4};

const $=id=>document.getElementById(id);
const sessionUserId=(()=>{let x=localStorage.getItem("hangout_duo_user");if(!x){x=crypto.randomUUID();localStorage.setItem("hangout_duo_user",x)}return x})();
let userName=localStorage.getItem("hangout_duo_name")||"";
let isHost=false, roomChannel=null, chatChannel=null, memberWatcher=null;
let hostId=null, peerId=null, pc=null, shareStream=null, remoteSession=null, micStream=null, micOn=false;
let pendingIce=[], makingOffer=false, joined=false, toastTimer=null, signalPoller=null, seenSignals=new Set(), seenSignalSids=new Set(), signalSince=0;


function debugLog(...args){
  const msg=args.map(x=>typeof x==="string"?x:JSON.stringify(x)).join(" ");
  console.log("[Hangout DEBUG]",...args);
  const p=$("debugPanel");if(!p)return;
  const line=document.createElement("div");line.textContent=msg;p.appendChild(line);
  while(p.children.length>18)p.removeChild(p.firstChild);
  p.scrollTop=p.scrollHeight;
}
function toast(s){const t=$("toast");t.textContent=s;t.classList.add("show");clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove("show"),2400)}
function initials(n){return (n||"U").trim().split(/\s+/).slice(0,2).map(x=>x[0]).join("").toUpperCase()||"U"}
function timeNow(){return new Date().toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"})}
function showRoom(){ $("landing").style.display="none"; $("room").style.display="block" }
function showLanding(){ $("room").style.display="none"; $("landing").style.display="flex" }

async function members(){
  const {data,error}=await supabaseClient.from("room_members").select("user_id,user_name,joined_at").eq("room_code",ROOM_CODE).order("joined_at",{ascending:true});
  if(error)throw error;
  return data||[];
}
async function roomExists(){
  const {data,error}=await supabaseClient.from("rooms").select("room_code,room_name").eq("room_code",ROOM_CODE).limit(1);
  if(error)throw error;
  return !!data?.length;
}
async function ensureRoom(){
  const exists=await roomExists();
  if(!exists){
    const {error}=await supabaseClient.from("rooms").insert({room_code:ROOM_CODE,room_name:"Hangout"});
    if(error && !String(error.message||"").toLowerCase().includes("duplicate"))throw error;
  }
}
async function clearCurrentRoom(){
  // Create starts a genuinely fresh 2-person test room.
  await supabaseClient.from("room_members").delete().eq("room_code",ROOM_CODE);
  await supabaseClient.from("room_messages").delete().eq("room_code",ROOM_CODE);
}
async function joinMember(){
  const list=await members();
  const mine=list.find(x=>x.user_id===sessionUserId);
  if(mine)return list;
  if(list.length>=2)throw new Error("This Hangout already has two people.");
  const {error}=await supabaseClient.from("room_members").insert({room_code:ROOM_CODE,user_id:sessionUserId,user_name:userName||"Friend"});
  if(error)throw error;
  return await members();
}
async function loadChat(){
  $("messages").innerHTML="";
  const {data}=await supabaseClient.from("room_messages").select("id,user_id,user_name,message,created_at,message_type").eq("room_code",ROOM_CODE).eq("message_type","chat").order("id",{ascending:true}).limit(100);
  (data||[]).forEach(addMessage);
}
function addMessage(m){
  if(document.querySelector('[data-msg-id="'+m.id+'"]'))return;
  const wrap=document.createElement("div");wrap.className="msg";wrap.dataset.msgId=m.id;
  const av=document.createElement("div");av.className="avatar";av.textContent=initials(m.user_name);
  const body=document.createElement("div");
  const top=document.createElement("div");top.innerHTML='<span class="msg-name"></span><span class="msg-time"></span>';top.querySelector(".msg-name").textContent=m.user_name||"User";top.querySelector(".msg-time").textContent=m.created_at?new Date(m.created_at).toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"}):timeNow();
  const text=document.createElement("div");text.className="msg-text";text.textContent=m.message||"";
  body.append(top,text);wrap.append(av,body);$("messages").appendChild(wrap);$("messages").scrollTop=$("messages").scrollHeight;
}
async function sendChat(e){
  e.preventDefault();const input=$("chatInput"),text=input.value.trim();if(!text||!joined)return;input.value="";
  const {data,error}=await supabaseClient.from("room_messages").insert({room_code:ROOM_CODE,user_id:sessionUserId,user_name:userName||"User",message:text,message_type:"chat"}).select().single();
  if(!error&&data){addMessage(data);await chatBroadcast({...data,from:sessionUserId});}else if(error)toast("Message could not be sent");
}
function setStatus(text,online=false){$("roleStatus").textContent=text;$("roleStatus").classList.toggle("online",online)}
function setMemberCount(n){$("memberCount").textContent=n>=2?"2/2 connected":n===1?"Waiting for friend":"No one connected"}

async function openChannels(){
  roomChannel=supabaseClient.channel("hangout-duo-signal",{config:{broadcast:{self:false,ack:true}}});
  roomChannel.on("broadcast",{event:"signal"},({payload})=>handleSignal(payload));
  await new Promise((resolve,reject)=>{
    roomChannel.subscribe((s,err)=>{console.log("[Signal]",s,err||"");if(s==="SUBSCRIBED")resolve();if(s==="CHANNEL_ERROR"||s==="TIMED_OUT")reject(new Error("Signal channel unavailable"))});
  });
  chatChannel=supabaseClient.channel("hangout-duo-chat",{config:{broadcast:{self:false}}});
  chatChannel.on("broadcast",{event:"chat"},({payload})=>{if(payload?.from!==sessionUserId)addMessage(payload)});
  await new Promise((resolve,reject)=>{
    chatChannel.subscribe(s=>{if(s==="SUBSCRIBED")resolve();if(s==="CHANNEL_ERROR"||s==="TIMED_OUT")reject(new Error("Chat channel unavailable"))});
  });
}
async function signal(payload){
  const data={...payload,from:payload.from||sessionUserId,sid:payload.sid||crypto.randomUUID()};
  // Signaling must never block WebRTC setup. After a Stop/Share cycle the
  // existing Realtime channel can take a long time to resolve a send.
  // Fire both transports in the background; DB remains the fallback.
  if(roomChannel){
    Promise.resolve(roomChannel.send({type:"broadcast",event:"signal",payload:data})).catch(()=>{});
  }
  void (async()=>{
    try{
      await supabaseClient.from("room_messages").insert({
        room_code:ROOM_CODE,
        user_id:sessionUserId,
        user_name:userName||"User",
        message:JSON.stringify(data),
        message_type:"signal"
      });
    }catch(e){}
  })();
}
async function pollSignals(){
  if(!joined)return;
  try{
    const {data}=await supabaseClient.from("room_messages").select("id,message,created_at").eq("room_code",ROOM_CODE).eq("message_type","signal").order("id",{ascending:false}).limit(40);
    for(const row of (data||[]).reverse()){
      if(seenSignals.has(row.id))continue;
      seenSignals.add(row.id);
      if(signalSince && row.created_at && Date.parse(row.created_at)<signalSince)continue;
      let d=null;try{d=JSON.parse(row.message||"")}catch{}
      if(!d||d.from===sessionUserId)continue;
      await handleSignal(d);
    }
    if(seenSignals.size>200){seenSignals=new Set(Array.from(seenSignals).slice(-100))}
  }catch(e){}
}
function startSignalPolling(){clearInterval(signalPoller);signalPoller=setInterval(pollSignals,250);pollSignals()}
function stopSignalPolling(){clearInterval(signalPoller);signalPoller=null;seenSignals=new Set();seenSignalSids=new Set();signalSince=0}
async function chatBroadcast(payload){if(chatChannel)try{await chatChannel.send({type:"broadcast",event:"chat",payload})}catch(e){}}

function closePeer(){if(pc){try{pc.onicecandidate=null;pc.ontrack=null;pc.onconnectionstatechange=null;pc.close()}catch{}pc=null}peerId=null;pendingIce=[]}
function setRemote(stream){
  const v=$("screenVideo"),a=$("screenAudio");
  const sameStream=v.srcObject===stream;
  if(!sameStream){
    v.srcObject=stream;
    a.srcObject=stream;
  }else if(a.srcObject!==stream){
    a.srcObject=stream;
  }
  v.muted=true;
  debugLog("REMOTE: setRemote tracks="+stream.getTracks().map(t=>t.kind+":"+t.readyState).join(",")+" same="+sameStream);
  $("mediaCard").classList.add("live-on");
  $("placeholderText").textContent="Your friend is sharing a screen.";

  const playVideo=()=>{
    if(v.srcObject!==stream)return;
    debugLog("VIDEO: play() attempt w="+v.videoWidth+" h="+v.videoHeight+" ready="+v.readyState+" paused="+v.paused);
    if(!v.paused)return;
    v.play().then(()=>{
      debugLog("VIDEO: PLAYING w="+v.videoWidth+" h="+v.videoHeight+" ready="+v.readyState);
      console.log("[WebRTC viewer] video playing",{
        width:v.videoWidth,height:v.videoHeight,ready:v.readyState
      });
    }).catch(e=>{debugLog("VIDEO: play FAILED "+(e?.name||"")+" "+(e?.message||e));console.warn("[WebRTC viewer] video play retry",e)});
  };
  v.onloadedmetadata=()=>{debugLog("VIDEO: loadedmetadata w="+v.videoWidth+" h="+v.videoHeight);playVideo()};
  v.oncanplay=()=>{debugLog("VIDEO: canplay");playVideo()};
  playVideo();

  [150,500,1000,2000].forEach(ms=>setTimeout(()=>{
    if(v.srcObject===stream && v.paused)playVideo();
  },ms));

  if(a.paused)a.play().catch(()=>{});
}
function hideRemote(){
  $("mediaCard").classList.remove("live-on");
  $("placeholderText").innerHTML="Create the room and share your screen.<br>Your friend will see it here.";
}
function clearRemote(){
  const v=$("screenVideo"),a=$("screenAudio");v.srcObject=null;a.srcObject=null;
  hideRemote();
}
async function addQueuedIce(){
  if(!pc?.remoteDescription)return;
  const session=remoteSession;
  const q=pendingIce.splice(0);
  for(const item of q){if(item.session!==session)continue;try{await pc.addIceCandidate(new RTCIceCandidate(item.candidate))}catch{}}
}
async function createHostPeer(target,session){
  if(!isHost||(!shareStream&&!micOn)||!target||makingOffer)return;
  if(pc&&peerId===target&&!["failed","closed"].includes(pc.connectionState))return;
  makingOffer=true;closePeer();peerId=target;remoteSession=session||crypto.randomUUID();pc=new RTCPeerConnection(ICE_CONFIG);
  const localSession=remoteSession;
  if(shareStream)shareStream.getTracks().forEach(t=>pc.addTrack(t,shareStream));
  if(micStream&&micOn)micStream.getTracks().forEach(t=>pc.addTrack(t,micStream));
  const hostPc=pc;
  let restartTimer=null;
  const restartIce=async()=>{
    if(pc!==hostPc||!shareStream||hostPc.signalingState!=="stable"||makingOffer)return;
    try{
      console.log("[WebRTC host] restarting ICE");
      makingOffer=true;hostPc.restartIce();
      const offer=await hostPc.createOffer({iceRestart:true});
      await hostPc.setLocalDescription(offer);
      await signal({type:"offer",from:sessionUserId,to:target,session:localSession,sdp:{type:hostPc.localDescription.type,sdp:hostPc.localDescription.sdp}});
    }catch(e){console.error("[WebRTC host ICE restart]",e)}
    finally{makingOffer=false}
  };
  pc.onicecandidate=e=>{if(e.candidate&&pc===hostPc)signal({type:"ice",from:sessionUserId,to:target,session:localSession,candidate:e.candidate.toJSON?.()||e.candidate})};
  pc.oniceconnectionstatechange=()=>console.log("[WebRTC host ICE]",hostPc?.iceConnectionState);
  pc.onsignalingstatechange=()=>console.log("[WebRTC host signaling]",hostPc?.signalingState);
  pc.onconnectionstatechange=()=>{
    console.log("[WebRTC host]",hostPc?.connectionState);
    if(hostPc?.connectionState==="disconnected"){
      clearTimeout(restartTimer);
      restartTimer=setTimeout(()=>{if(hostPc?.connectionState==="disconnected")restartIce()},3000);
    }else if(hostPc?.connectionState==="connected"){
      clearTimeout(restartTimer);
      applyQuality().catch(e=>console.warn("[WebRTC host] quality setup",e));
    }else if(hostPc?.connectionState==="failed"){
      clearTimeout(restartTimer);
      restartTimer=setTimeout(()=>{if(pc===hostPc&&hostPc.connectionState==="failed")restartIce()},500);
    }
  };
  try{
    const offer=await pc.createOffer({offerToReceiveAudio:true});
    await pc.setLocalDescription(offer);
    await signal({type:"offer",from:sessionUserId,to:target,session:localSession,sdp:{type:pc.localDescription.type,sdp:pc.localDescription.sdp}});
  }catch(e){closePeer()}finally{makingOffer=false}
}
async function createViewerPeer(from,session,sdp){
  debugLog("VIEWER: create peer", {from, session});
  if(isHost||!sdp){debugLog("VIEWER: create peer skipped");return;}
  closePeer();peerId=from;remoteSession=session;pc=new RTCPeerConnection(ICE_CONFIG);
  const remote=new MediaStream();
  if(micStream&&micOn)micStream.getTracks().forEach(t=>pc.addTrack(t,micStream));
  pc.ontrack=e=>{
    debugLog("TRACK: "+(e.track?.kind||"?")+" state="+(e.track?.readyState||"?")+" streams="+(e.streams?.length||0));
    console.log("[WebRTC track]",e.track?.kind,e.track?.readyState,e.streams?.length);
    const incoming=e.streams?.[0];
    const stream=incoming||remote;
    if(!incoming&&e.track&&!remote.getTracks().some(t=>t.id===e.track.id))remote.addTrack(e.track);
    e.track.onunmute=()=>{debugLog("TRACK: unmute "+e.track.kind);console.log("[WebRTC track] resumed",e.track.kind);setRemote(stream)};
    e.track.onmute=()=>{debugLog("TRACK: mute "+e.track.kind);console.log("[WebRTC track] muted",e.track.kind);hideRemote()};
    setRemote(stream);
    if(e.track.kind==="video"){
      setTimeout(()=>{
        const v=$("screenVideo");
        if(v.srcObject===stream && (!v.videoWidth || v.readyState<3) && pc?.connectionState==="connected"){
          debugLog("VIDEO: no frame after 1.8s", {w:v.videoWidth,h:v.videoHeight,ready:v.readyState,state:pc?.connectionState});
          console.warn("[WebRTC viewer] no decoded video frame; requesting fresh offer");
          signal({type:"refresh",from:sessionUserId,to:from,session:session}).catch(()=>{});
        }
      },1800);
    }
  };
  pc.onicecandidate=e=>{if(e.candidate)signal({type:"ice",from:sessionUserId,to:from,session:session,candidate:e.candidate.toJSON?.()||e.candidate})};
  pc.oniceconnectionstatechange=()=>console.log("[WebRTC viewer ICE]",pc?.iceConnectionState);
  pc.onsignalingstatechange=()=>console.log("[WebRTC viewer signaling]",pc?.signalingState);
  let viewerRecoveryTimer=null;
  pc.onconnectionstatechange=()=>{
    const state=pc?.connectionState;
    debugLog("CONNECTION: "+(state||"?"));
    console.log("[WebRTC viewer]",state);
    if(state==="disconnected"){
      clearTimeout(viewerRecoveryTimer);
      viewerRecoveryTimer=setTimeout(()=>{
        if(pc?.connectionState==="disconnected"){
          debugLog("ICE: requesting host ICE restart");
          signal({type:"ice-restart",from:sessionUserId,to:from,session:session}).catch(()=>{});
        }
      },1800);
    }else if(state==="connected"){
      clearTimeout(viewerRecoveryTimer);
    }else if(state==="failed"){
      clearTimeout(viewerRecoveryTimer);
      debugLog("ICE: viewer failed; requesting host ICE restart");
      signal({type:"ice-restart",from:sessionUserId,to:from,session:session}).catch(()=>{});
      // Keep the existing video visible while the ICE restart is negotiated.
      // Only a genuinely new share session should replace the peer.
    }else if(state==="closed"){
      clearTimeout(viewerRecoveryTimer);
    }
  };
  try{
    debugLog("SDP: setting remote offer");
    await pc.setRemoteDescription(new RTCSessionDescription(sdp));debugLog("SDP: remote offer set");
    await addQueuedIce();
    const answer=await pc.createAnswer();await pc.setLocalDescription(answer);debugLog("SDP: answer sent");
    await signal({type:"answer",from:sessionUserId,to:from,session:session,sdp:{type:pc.localDescription.type,sdp:pc.localDescription.sdp}});
  }catch(e){debugLog("VIEWER ERROR: "+(e?.name||"")+" "+(e?.message||e));closePeer();clearRemote()}
}
async function handleSignal(d){
  if(!d||d.from===sessionUserId)return;
  if(d.sid){if(seenSignalSids.has(d.sid))return;seenSignalSids.add(d.sid);if(seenSignalSids.size>300)seenSignalSids=new Set(Array.from(seenSignalSids).slice(-150))}
  if(d.to&&d.to!==sessionUserId)return;
  if(d.type==="hello"){
    if(!isHost||(!shareStream&&!micOn))return;
    console.log("[WebRTC host] hello received",{
      from:d.from,
      currentPeer:peerId,
      state:pc?.connectionState||null,
      session:remoteSession
    });
    // A live host peer is already the connection for this guest. A late
    // hello from the viewer must NEVER create another RTCPeerConnection,
    // because that closes the working peer while its ICE is still starting.
    if(pc && !["failed","closed"].includes(pc.connectionState)){
      if(peerId===d.from || peerId){
        console.log("[WebRTC host] ignoring hello; active peer exists");
        return;
      }
    }
    return createHostPeer(d.from,crypto.randomUUID());
  }
  if(d.type==="stop"){
    if(!isHost&&d.session===remoteSession){
      // A screen-share session is disposable. Tear down the viewer peer so
      // the next Share gets a completely fresh offer/answer/receiver.
      clearRemote();
      closePeer();
      remoteSession=null;
    }
    return;
  }
  if(d.type==="offer"&&!isHost){
    debugLog("OFFER: received session="+d.session);
    console.log("[WebRTC viewer] offer received",{
      from:d.from,
      session:d.session,
      currentSession:remoteSession,
      currentPeer:peerId,
      state:pc?.signalingState||null
    });
    // Every host offer is authoritative. A fresh screen-share gets a new
    // session ID, so the old remoteSession must never block it.
    if(remoteSession&&d.session!==remoteSession){
      console.log("[WebRTC viewer] replacing stale session",remoteSession,"with",d.session);
    }
    if(pc&&peerId===d.from&&remoteSession===d.session&&pc.signalingState==="stable"){
      try{
        await pc.setRemoteDescription(new RTCSessionDescription(d.sdp));
        const answer=await pc.createAnswer();
        await pc.setLocalDescription(answer);
        await signal({type:"answer",from:sessionUserId,to:d.from,session:d.session,sdp:{type:pc.localDescription.type,sdp:pc.localDescription.sdp}});
        debugLog("SDP: same-session offer answered");
      }catch(e){
        console.error("[WebRTC viewer renegotiation]",e);
        debugLog("VIEWER renegotiation ERROR: "+(e?.message||e));
      }
      return;
    }
    // Different session = a new share attempt. Replace the old peer and
    // accept the new offer even if the old stop signal was lost.
    return createViewerPeer(d.from,d.session,d.sdp);
  }
  if(d.type==="ice-restart"&&isHost&&pc&&d.from===peerId&&d.session===remoteSession){
    if(pc.signalingState!=="stable"||makingOffer)return;
    try{
      makingOffer=true;
      console.log("[WebRTC host] ICE restart requested by viewer");
      debugLog("HOST: ICE restart requested");
      pc.restartIce();
      const offer=await pc.createOffer({iceRestart:true});
      await pc.setLocalDescription(offer);
      await signal({
        type:"offer",from:sessionUserId,to:peerId,session:remoteSession,
        sdp:{type:pc.localDescription.type,sdp:pc.localDescription.sdp}
      });
      debugLog("HOST: ICE restart offer sent");
    }catch(e){
      console.error("[WebRTC host ICE restart]",e);
      debugLog("HOST ICE restart ERROR: "+(e?.message||e));
    }finally{makingOffer=false}
    return;
  }
  if(d.type==="refresh"&&isHost&&pc&&d.from===peerId&&d.session===remoteSession){
    if(pc.signalingState!=="stable"||makingOffer)return;
    try{
      makingOffer=true;
      const offer=await pc.createOffer({offerToReceiveAudio:true});
      await pc.setLocalDescription(offer);
      await signal({
        type:"offer",from:sessionUserId,to:peerId,session:remoteSession,
        sdp:{type:pc.localDescription.type,sdp:pc.localDescription.sdp}
      });
      console.log("[WebRTC host] refresh offer sent");
    }catch(e){console.error("[WebRTC host refresh]",e)}
    finally{makingOffer=false}
    return;
  }
  if(d.type==="answer"&&isHost&&pc&&d.from===peerId&&d.session===remoteSession){
    try{if(pc.signalingState==="have-local-offer"){await pc.setRemoteDescription(new RTCSessionDescription(d.sdp));await addQueuedIce()}}catch{}
    return;
  }
  if(d.type==="quality"&&isHost){return handleQuality(d)}
  if(d.type==="ice"&&d.session){
    if(isHost){if(d.from!==peerId||d.session!==remoteSession)return}
    else if(d.from!==hostId||d.session!==remoteSession)return;
    if(!pc?.remoteDescription){pendingIce.push({candidate:d.candidate,session:d.session});return}
    try{await pc.addIceCandidate(new RTCIceCandidate(d.candidate))}catch{}
  }
}
async function requestHost(){if(!isHost)await signal({type:"hello",from:sessionUserId,to:hostId||"host"})}
async function rebuildHostPeer(){
  if(!isHost||(!shareStream&&!micOn)||!peerId)return;
  await createHostPeer(peerId,crypto.randomUUID());
}
async function toggleMic(){
  const next=!micOn;
  if(next){
    if(!navigator.mediaDevices?.getUserMedia){toast("Microphone is not supported in this browser");return}
    try{
      micStream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}});
      micOn=true;$("micBtn").textContent="🎤 Mic On";$("micBtn").classList.add("active");
      toast("Microphone on");
    }catch(e){toast(e?.name==="NotAllowedError"?"Microphone permission was denied":"Could not start microphone");return}
  }else{
    micOn=false;
    if(micStream){micStream.getTracks().forEach(t=>{try{t.stop()}catch{}});micStream=null}
    $("micBtn").textContent="🎤 Mic";$("micBtn").classList.remove("active");toast("Microphone off");
  }
  closePeer();
  if(isHost)await rebuildHostPeer();else setTimeout(requestHost,100);
}

async function startShare(){
  if(!isHost){toast("Only the host can share the screen");return}
  if(!navigator.mediaDevices?.getDisplayMedia){toast("Screen sharing is not supported in this browser");return}
  if(shareStream){stopShare();return}
  try{
    shareStream=await navigator.mediaDevices.getDisplayMedia({
      video:{width:{ideal:1920,max:1920},height:{ideal:1080,max:1080},frameRate:{ideal:30,max:60}},
      audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false},
      systemAudio:"include",surfaceSwitching:"include",selfBrowserSurface:"exclude",preferCurrentTab:false
    });
    const track=shareStream.getVideoTracks()[0];
    if(track)track.addEventListener("ended",()=>{if(shareStream)stopShare()},{once:true});
    $("mediaCard").classList.add("live-on");
    $("screenVideo").srcObject=shareStream;$("screenVideo").muted=true;$("screenVideo").play().catch(()=>{});
    $("placeholderText").textContent="You are sharing your screen.";
    $("shareBtn").textContent="Stop Share";$("controlShare").textContent="■ Stop";
    const list=await members();const guest=list.find(m=>m.user_id!==sessionUserId);
    if(guest){
      // Each screen-share is its own WebRTC media session. The previous
      // session is fully closed on Stop, so start a clean offer/answer pair.
      // This avoids relying on browser-specific receiver behavior after a
      // screen track has ended.
      if(pc)closePeer();
      remoteSession=null;
      await createHostPeer(guest.user_id,crypto.randomUUID());
    }
    toast("Screen sharing started");
  }catch(e){
    console.error("[WebRTC host] screen-share start failed",e);
    if(shareStream){try{shareStream.getTracks().forEach(t=>t.stop())}catch{}}
    shareStream=null;
    toast(e?.name==="NotAllowedError"?"Screen share cancelled":"Could not start screen share")
  }
}
async function stopShare(){
  const target=peerId,old=remoteSession;
  if(target&&old)signal({type:"stop",from:sessionUserId,to:target,session:old}).catch(()=>{});

  // Screen sharing is a disposable media session. Close the old peer
  // completely so the next Share starts from a clean SDP/ICE state.
  if(pc&&isHost)closePeer();
  if(shareStream){shareStream.getTracks().forEach(t=>{try{t.stop()}catch{}});shareStream=null}
  $("screenVideo").srcObject=null;clearRemote();
  $("shareBtn").textContent="Share Screen";$("controlShare").textContent="▣ Share";
  $("placeholderText").textContent="Create the room and share your screen.";
}
async function applyQuality(){
  const value=$("quality").value;
  if(!isHost||!pc)return;
  const preset={source:{bitrate:12000000,fps:60,scale:1},480:{bitrate:1600000,fps:30,scale:2.25},720:{bitrate:3500000,fps:30,scale:1.5},1080:{bitrate:8000000,fps:30,scale:1}}[value]||null;
  if(!preset)return;
  for(const sender of pc.getSenders()){
    if(!sender.track||!sender.setParameters)continue;
    try{const p=sender.getParameters();if(!p.encodings?.length)continue;
      p.encodings.forEach(e=>{
        if(sender.track.kind==="video"){e.maxBitrate=preset.bitrate;e.maxFramerate=preset.fps;e.scaleResolutionDownBy=preset.scale}
        if(sender.track.kind==="video" && "degradationPreference" in p)p.degradationPreference="maintain-resolution"
        else if(sender.track.kind==="audio"){e.maxBitrate=128000}
      });
      await sender.setParameters(p)
    }catch{}
  }
}
async function requestQuality(){
  if(isHost){await applyQuality();return}
  await signal({type:"quality",from:sessionUserId,to:hostId,quality:$("quality").value});
}
async function handleQuality(d){
  if(!isHost||d.from!==peerId||!shareStream)return;
  $("quality").value=["source","480","720","1080"].includes(d.quality)?d.quality:"720";await applyQuality();
}

async function joinRoom(asHost){
  userName=userName.trim()|| (asHost?"Host":"Friend");
  localStorage.setItem("hangout_duo_name",userName);
  showRoom();setStatus(asHost?"Host":"Joining…");
  try{
    await ensureRoom();
    if(asHost){await clearCurrentRoom()}
    const list=await joinMember();
    if(list.length>2)throw new Error("This room is full.");
    hostId=list[0]?.user_id||sessionUserId;isHost=hostId===sessionUserId;
    setStatus(isHost?"Host":"Friend",true);setMemberCount(list.length);joined=true;
    $("shareBtn").style.display=isHost?"block":"none";$("controlShare").style.display=isHost?"block":"none";
    await loadChat();await openChannels();signalSince=Date.now()-1500;startSignalPolling();
    if(!isHost){setTimeout(requestHost,100);setTimeout(requestHost,400);setTimeout(requestHost,1000)}
    startMemberWatcher();
    toast(isHost?"Room created":"Joined Hangout");
  }catch(e){
    console.error(e);toast(e?.message||"Could not join Hangout");await leaveRoom(false);
  }
}
function startMemberWatcher(){
  clearInterval(memberWatcher);
  memberWatcher=setInterval(async()=>{
    if(!joined)return;
    try{
      const list=await members();setMemberCount(list.length);
      const other=list.find(m=>m.user_id!==sessionUserId);
      if(other){if(!peerId)peerId=other.user_id}
      else{peerId=null;if(!isHost){closePeer();clearRemote()}}
      if(isHost&&(shareStream||micOn)&&other&&!pc)await createHostPeer(other.user_id,crypto.randomUUID());
    }catch{}
  },2500);
}
async function leaveRoom(returnLanding=true){
  joined=false;clearInterval(memberWatcher);memberWatcher=null;stopSignalPolling();stopShare();
  closePeer();
  if(roomChannel){try{await roomChannel.unsubscribe()}catch{}roomChannel=null}
  if(chatChannel){try{await chatChannel.unsubscribe()}catch{}chatChannel=null}
  try{await supabaseClient.from("room_members").delete().eq("room_code",ROOM_CODE).eq("user_id",sessionUserId)}catch{}
  isHost=false;hostId=null;peerId=null;remoteSession=null;clearRemote();
  if(micStream){micStream.getTracks().forEach(t=>{try{t.stop()}catch{}});micStream=null}micOn=false;
  if(returnLanding){showLanding();setStatus("Connecting…")}
}
$("createBtn").onclick=()=>{userName="Host";joinRoom(true)};
$("joinBtn").onclick=()=>{userName="Friend";joinRoom(false)};
$("leaveBtn").onclick=()=>leaveRoom(true);
$("shareBtn").onclick=startShare;$("controlShare").onclick=startShare;$("micBtn").onclick=toggleMic;
$("fitBtn").onclick=()=>{
  const card=$("mediaCard");
  const fill=card.classList.toggle("fill-mode");
  $("fitBtn").textContent=fill?"Fill":"Fit";
};
$("quality").onchange=()=>requestQuality();
$("mediaCard").onclick=()=>{debugLog("TAP: media card");$("mediaCard").classList.add("controls");clearTimeout(window.__hideControls);window.__hideControls=setTimeout(()=>$("mediaCard").classList.remove("controls"),3000)};
$("chatForm").addEventListener("submit",sendChat);
window.addEventListener("beforeunload",()=>{try{supabaseClient.from("room_members").delete().eq("room_code",ROOM_CODE).eq("user_id",sessionUserId)}catch{}});
window.addEventListener("error",e=>console.error("[Hangout JS error]",e.error||e.message));
window.addEventListener("unhandledrejection",e=>console.error("[Hangout promise error]",e.reason));
</script>
